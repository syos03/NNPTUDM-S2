<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Dashboard</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        tr:nth-child(odd) {
            background-color: #000;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #fff;
            color: #000;
        }

        thead tr {
            background-color: #333 !important;
            color: #fff !important;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        #search,
        #pageSize {
            padding: 8px;
            margin-bottom: 10px;
        }

        #search {
            width: 300px;
        }

        .pagination {
            margin-top: 10px;
        }

        .pagination button {
            padding: 5px 10px;
            margin: 2px;
        }

        .sort-buttons {
            margin-bottom: 10px;
        }

        .sort-buttons button {
            padding: 5px 10px;
            margin: 2px;
        }
    </style>
</head>

<body>
    <h2>Products Dashboard</h2>
    <div>
        <input type="text" id="search" placeholder="Search by title..." oninput="SearchProducts()" />
        <select id="pageSize" onchange="ChangePageSize()">
            <option value="5">5 per page</option>
            <option value="10" selected>10 per page</option>
            <option value="20">20 per page</option>
        </select>
    </div>
    <div class="sort-buttons">
        <button onclick="SortByPrice('asc')">Price ↑</button>
        <button onclick="SortByPrice('desc')">Price ↓</button>
        <button onclick="SortByTitle('asc')">Title A-Z</button>
        <button onclick="SortByTitle('desc')">Title Z-A</button>
    </div>
    <div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody id="products-table">
            </tbody>
        </table>
    </div>
    <div class="pagination" id="pagination">
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
