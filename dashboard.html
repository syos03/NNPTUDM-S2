<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Dashboard</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        tr:nth-child(odd) {
            background-color: #000;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #fff;
            color: #000;
        }

        thead tr {
            background-color: #333 !important;
            color: #fff !important;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        #search,
        #pageSize {
            padding: 8px;
            margin-bottom: 10px;
        }

        #search {
            width: 300px;
        }

        .pagination {
            margin-top: 10px;
        }

        .pagination button {
            padding: 5px 10px;
            margin: 2px;
        }

        .sort-buttons {
            margin-bottom: 10px;
        }

        .sort-buttons button {
            padding: 5px 10px;
            margin: 2px;
        }
    </style>
</head>

<body>
    <h2>Products Dashboard</h2>
    <div>
        <input type="text" id="search" placeholder="Search by title..." oninput="SearchProducts()" />
        <select id="pageSize" onchange="ChangePageSize()">
            <option value="5">5 per page</option>
            <option value="10" selected>10 per page</option>
            <option value="20">20 per page</option>
        </select>
    </div>
    <div class="sort-buttons">
        <button onclick="SortByPrice('asc')">Price ↑</button>
        <button onclick="SortByPrice('desc')">Price ↓</button>
        <button onclick="SortByTitle('asc')">Title A-Z</button>
        <button onclick="SortByTitle('desc')">Title Z-A</button>
    </div>
    <div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody id="products-table">
            </tbody>
        </table>
    </div>
    <div class="pagination" id="pagination">
    </div>

    <script>
        let allProducts = [];
        let filteredProducts = [];
        let currentPage = 1;
        let pageSize = 10;

        async function GetAllProducts() {
            try {
                let res = await fetch('https://api.escuelajs.co/api/v1/products');
                if (res.ok) {
                    allProducts = await res.json();
                    filteredProducts = allProducts;
                    DisplayProducts();
                }
            } catch (error) {
                console.log(error);
            }
        }

        function DisplayProducts() {
            let bodyTable = document.getElementById('products-table');
            bodyTable.innerHTML = '';

            let start = (currentPage - 1) * pageSize;
            let end = start + pageSize;
            let paginatedProducts = filteredProducts.slice(start, end);

            for (const product of paginatedProducts) {
                bodyTable.innerHTML += `<tr>
                    <td>${product.id}</td>
                    <td>${product.title}</td>
                    <td>$${product.price}</td>
                    <td>${product.category.name}</td>
                    <td><img src="${product.images[0]}" alt="${product.title}"></td>
                </tr>`;
            }

            DisplayPagination();
        }

        function DisplayPagination() {
            let totalPages = Math.ceil(filteredProducts.length / pageSize);
            let paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                let btnStyle = i === currentPage ? 'font-weight: bold;' : '';
                paginationDiv.innerHTML += `<button style="${btnStyle}" onclick="GoToPage(${i})">${i}</button>`;
            }
        }

        function GoToPage(page) {
            currentPage = page;
            DisplayProducts();
        }

        function ChangePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            DisplayProducts();
        }

        function SearchProducts() {
            let searchText = document.getElementById('search').value.toLowerCase();
            filteredProducts = allProducts.filter(product =>
                product.title.toLowerCase().includes(searchText)
            );
            currentPage = 1;
            DisplayProducts();
        }

        function SortByPrice(order) {
            if (order === 'asc') {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else {
                filteredProducts.sort((a, b) => b.price - a.price);
            }
            currentPage = 1;
            DisplayProducts();
        }

        function SortByTitle(order) {
            if (order === 'asc') {
                filteredProducts.sort((a, b) => a.title.localeCompare(b.title));
            } else {
                filteredProducts.sort((a, b) => b.title.localeCompare(a.title));
            }
            currentPage = 1;
            DisplayProducts();
        }

        GetAllProducts();
    </script>
</body>

</html>
